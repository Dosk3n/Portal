name: Validate and publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Unit and HTTP integration tests
        run: python3 -m unittest discover -s tests -v
      - name: JavaScript syntax
        run: node --check app/static/app.js
      - name: Build and start isolated local app
        run: |
          mkdir -p data storage/inbox
          export PUID="$(id -u)" PGID="$(id -g)"
          docker compose up --build -d
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8769/health; then exit 0; fi
            sleep 1
          done
          docker compose logs
          exit 1
      - name: Install isolated browser test dependencies
        run: |
          npm install --prefix /tmp/portal-browser --no-audit --no-fund playwright@1.56.1
          /tmp/portal-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser workflows and mobile layout
        env:
          NODE_PATH: /tmp/portal-browser/node_modules
          PORTAL_ARTIFACT_DIR: /tmp/portal-browser
        run: |
          export CHROMIUM_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          node tests/browser.cjs
          node tests/refresh.cjs
      - name: Stop isolated app
        if: always()
        run: docker compose down

  publish:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v') && github.event.repository.private == true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Image metadata
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
