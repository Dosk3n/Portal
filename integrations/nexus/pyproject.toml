[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-tools-portal"
version = "0.2.0"
description = "Create, revise, find and share Portal reports through Nexus"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["nexus-core>=0.1.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["nexus_tools_portal*"]
exclude = ["old_nexus_tools_portal*"]
