# Copy to /opt/portal/compose.yaml on the deployment host and customise .env.
# Verify middleware names against the installed Saltbox version before use.
services:
  portal:
    image: "${PORTAL_IMAGE:?Set PORTAL_IMAGE to a versioned private GHCR image}"
    container_name: portal
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      PUBLIC_BASE_URL: "https://${PORTAL_HOST:?Set PORTAL_HOST}"
      TZ: "${TZ:-UTC}"
    command: ["python3", "/app/server.py", "--host", "0.0.0.0", "--data-dir", "/data", "--storage-dir", "/mnt/unionfs/Media/Portal"]
    volumes:
      - /opt/portal/data:/data
      - /mnt:/mnt
    networks:
      - saltbox
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    labels:
      com.github.saltbox.saltbox_managed: "true"
      traefik.enable: "true"
      traefik.docker.network: saltbox
      traefik.http.services.portal.loadbalancer.server.port: "8769"
      traefik.http.routers.portal.rule: "Host(`${PORTAL_HOST}`)"
      traefik.http.routers.portal.entrypoints: websecure
      traefik.http.routers.portal.tls.certresolver: "${TRAEFIK_CERTRESOLVER:-cfdns}"
      traefik.http.routers.portal.tls.options: "${TRAEFIK_TLS_OPTIONS:-securetls@file}"
      traefik.http.routers.portal.middlewares: "${PORTAL_PRIVATE_MIDDLEWARES:-authelia@docker},portal-private"
      traefik.http.routers.portal.service: portal
      traefik.http.routers.portal-api.rule: "Host(`${PORTAL_HOST}`) && (Path(`/api`) || PathPrefix(`/api/`))"
      traefik.http.routers.portal-api.priority: "100"
      traefik.http.routers.portal-api.entrypoints: websecure
      traefik.http.routers.portal-api.tls.certresolver: "${TRAEFIK_CERTRESOLVER:-cfdns}"
      traefik.http.routers.portal-api.tls.options: "${TRAEFIK_TLS_OPTIONS:-securetls@file}"
      traefik.http.routers.portal-api.middlewares: "${PORTAL_PUBLIC_MIDDLEWARES:-portal-public-defaults},portal-private"
      traefik.http.routers.portal-api.service: portal
      traefik.http.routers.portal-share.rule: "Host(`${PORTAL_HOST}`) && PathPrefix(`/share/`)"
      traefik.http.routers.portal-share.priority: "100"
      traefik.http.routers.portal-share.entrypoints: websecure
      traefik.http.routers.portal-share.tls.certresolver: "${TRAEFIK_CERTRESOLVER:-cfdns}"
      traefik.http.routers.portal-share.tls.options: "${TRAEFIK_TLS_OPTIONS:-securetls@file}"
      traefik.http.routers.portal-share.middlewares: "${PORTAL_PUBLIC_MIDDLEWARES:-portal-public-defaults},portal-public"
      traefik.http.routers.portal-share.service: portal
      traefik.http.middlewares.portal-private.headers.customrequestheaders.X-Portal-Public: "0"
      traefik.http.middlewares.portal-public.headers.customrequestheaders.X-Portal-Public: "1"
      traefik.http.middlewares.portal-public-defaults.headers.contenttypenosniff: "true"
      # Saltbox normally handles HTTP-to-HTTPS globally.
networks:
  saltbox:
    external: true
